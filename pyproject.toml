[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-keyboard"
version = "2.0.0"
description = "تشخیص و تبدیل خودکار layout فارسی/انگلیسی در لحظه تایپ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Amin Abdolahi" }
]
keywords = ["keyboard", "layout", "persian", "farsi", "english", "typing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]

dependencies = [
    "pynput>=1.7.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "keyboard>=0.13.0",
    "pywin32>=300; sys_platform == 'win32'",
    "pyperclip>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Amin-Abdolahi/smart-keyboard-new-version"
Repository = "https://github.com/Amin-Abdolahi/smart-keyboard-new-version"
Issues = "https://github.com/Amin-Abdolahi/smart-keyboard-new-version/issues"
Changelog = "https://github.com/Amin-Abdolahi/smart-keyboard-new-version/blob/main/CHANGELOG.md"

[project.scripts]
smart-keyboard = "main:main"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]